name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    name: Pruebas (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # El servidor de Minecraft de las pruebas es un programa Java pequeño (test/fixtures/java).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm run build

      - name: Unitarias y casos de uso
        run: npm test

      - name: Navegador y accesibilidad (Playwright + axe)
        if: matrix.os == 'ubuntu-latest'
        run: |
          npm i --no-save playwright axe-core
          npx playwright install --with-deps chromium
          npm run test:e2e
